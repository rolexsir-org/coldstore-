# Alembic configuration for the ISOLATED telemetry database (data/telemetry.db).
# One migration story for the whole system: same tooling as the business DB
# (alembic.ini), separate version lineage, separate target file.
#
# Existing deployments (schema already created by telemetry.tdb.init_schema,
# version-stamped in kv_meta) must be STAMPED, not upgraded:
#   alembic -c alembic_telemetry.ini stamp 0001
# Fresh databases can be created purely from migrations:
#   alembic -c alembic_telemetry.ini upgrade head
# See ARCHITECTURE.md §7 for the full procedure.
[alembic]
script_location = alembic_telemetry
prepend_sys_path = .
sqlalchemy.url = sqlite:///./data/telemetry.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
